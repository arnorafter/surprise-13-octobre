<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Pour toi ❤️</title>
<style>
body { margin:0; padding:0; height:100vh; font-family:Arial, sans-serif; color:white; text-align:center; overflow:hidden;}
body::before { content:""; position:fixed; top:0; left:0; width:100%; height:100%; background:url("photo.jpg") no-repeat center/cover; filter:blur(8px) brightness(0.5); z-index:-1;}
.container { position:relative; top:50%; transform:translateY(-50%); padding:20px; opacity:1; transition:opacity 2s ease;}
.fade-out { opacity:0; }
.fade-in { animation:fadeIn 2s forwards; }
@keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
h1 { font-size:42px; }
#message { font-size:22px; max-width:600px; margin:20px auto; }
#countdown { font-size:26px; margin-top:20px; }
audio { margin-top:30px; }
.hidden { display:none; }
#finalMessage { margin-top:25px; font-size:20px; opacity:0; transition:opacity 2s ease;}
.heart { position:fixed; bottom:-20px; font-size:20px; animation:floatUp 8s linear infinite; opacity:0.6;}
@keyframes floatUp { 0%{transform:translateY(0) scale(1); opacity:0.6;} 100%{transform:translateY(-110vh) scale(1.5); opacity:0;} }
</style>
</head>
<body>
<div class="container" id="container">
<h1>Pour toi ❤️</h1>
<div id="message">Parce que c'est ainsi que tout a commencé et ne finira jamais.</div>
<div id="countdown">Chargement…</div>
<div id="music" class="hidden">
<p>Maintenant… écoute ❤️</p>
<audio id="audioPlayer" controls>
<source src="chanson.mp3" type="audio/mpeg">
</audio>
<div id="finalMessage">Peu importe où la vie nous mène… je choisirai toujours de recommencer avec toi.</div>
</div>
</div>
<script>
window.onload = function() {
    const countdown = document.getElementById("countdown");
    const music = document.getElementById("music");
    const container = document.getElementById("container");
    const audio = document.getElementById("audioPlayer");
    const finalMessage = document.getElementById("finalMessage");

    // ========== CONFIG ==========
    let targetDate = new Date("2026-10-13T12:00:00+02:00").getTime();
    // Pour test ultra-rapide, décommente cette ligne:
    // targetDate = new Date(new Date().getTime() + 10*1000).getTime();

    function updateCountdown() {
        const now = new Date().getTime();
        const distance = targetDate - now;

        if(distance < 0){
            clearInterval(interval);
            countdown.innerHTML = "";
            container.classList.add("fade-out");
            setTimeout(()=>{
                music.classList.remove("hidden");
                container.classList.remove("fade-out");
                container.classList.add("fade-in");
            }, 1000);
            return;
        }

        const days = Math.floor(distance / (1000*60*60*24));
        const hours = Math.floor((distance % (1000*60*60*24))/(1000*60*60));
        const minutes = Math.floor((distance % (1000*60*60))/(1000*60));
        const seconds = Math.floor((distance % (1000*60))/1000);

        countdown.innerHTML = days+" jours "+hours+" heures "+minutes+" minutes "+seconds+" secondes";
    }

    let interval = setInterval(updateCountdown, 1000);
    updateCountdown(); // Appel immédiat pour affichage instantané

    // Message final
    audio.addEventListener("play", function(){
        finalMessage.style.opacity = 1;
    });

    // Cœurs
    function createHeart(){
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML="❤️";
        heart.style.left=Math.random()*100+"vw";
        heart.style.fontSize=(Math.random()*15+15)+"px";
        heart.style.animationDuration=(Math.random()*5+5)+"s";
        document.body.appendChild(heart);
        setTimeout(()=>heart.remove(),8000);
    }
    setInterval(createHeart,800);
};
</script>
</body>
</html>
